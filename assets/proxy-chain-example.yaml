# Mihomo 配置片段：合并进现有配置，不要用整个文件覆盖订阅。
# 把「已有入口节点」「已有普通节点」换成订阅里的真实名字。
# 复制一个真实出口节点，保留协议、地址、认证等全部参数，改名后加 dialer-proxy。
# 下方 SOCKS5 地址仅为格式示例，不是可用代理。
proxies:
  - name: 落地 A（经入口）
    type: socks5
    server: 192.0.2.1
    port: 1080
    dialer-proxy: 代理链入口

proxy-groups:
  - name: 应用代理链
    type: select
    proxies: [已有普通节点, 代理链出口]
  - name: 代理链入口
    type: select
    proxies: [已有入口节点]
  - name: 代理链出口
    type: select
    proxies: [落地 A（经入口）]

# 使用：在需要走链的已有业务策略组的 proxies 列表中加入「应用代理链」并选中它，
# 或让特定规则指向「应用代理链」。不要让入口或普通节点反向引用这三个组。
# 在面板依次选入口、出口；在「应用代理链」选择「代理链出口」启用，选普通节点退出。
# 可继续添加多个入口和出口节点；每个出口副本都要指定 dialer-proxy。
